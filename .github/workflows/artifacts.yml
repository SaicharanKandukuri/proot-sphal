name: Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  guest-runtime:
    name: Build AArch64 guest runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable AArch64 containers
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Build pinned guest stack
        run: ./scripts/build.sh out
      - name: Package guest runtime
        run: |
          mkdir -p dist
          epoch=$(git -C out/src/libhybris show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -C out/stage -cJf dist/proot-sphal-aarch64.tar.xz opt/proot-sphal
          (cd dist && sha256sum proot-sphal-aarch64.tar.xz > SHA256SUMS)
      - name: Upload guest runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proot-sphal-aarch64-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  termux-x11:
    name: Build paired Termux:X11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch pinned Termux:X11 source
        run: |
          url=$(python3 -c 'import json; print(json.load(open("build/source-lock.json"))["sources"]["termux_x11"]["url"])')
          revision=$(python3 -c 'import json; print(json.load(open("build/source-lock.json"))["sources"]["termux_x11"]["revision"])')
          git init -q build/termux-x11
          git -C build/termux-x11 remote add origin "$url"
          git -C build/termux-x11 fetch -q --depth=1 origin "$revision"
          git -C build/termux-x11 checkout -q --detach FETCH_HEAD
          test "$(git -C build/termux-x11 rev-parse HEAD)" = "$revision"
          git -C build/termux-x11 submodule update --init --recursive --jobs 8 --depth 1
      - name: Apply paired server patches
        run: ./scripts/apply-termux-x11-patches.sh build/termux-x11
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            build/termux-x11/*.gradle
            build/termux-x11/gradle/wrapper/gradle-wrapper.properties
      - name: Build APK and companion packages
        working-directory: build/termux-x11
        run: |
          ./gradlew assembleDebug
          ./build_termux_package
      - name: Package patched server
        run: |
          mkdir -p dist
          install -m 0644 \
            build/termux-x11/lorie-app/build/outputs/apk/debug/lorie-app-debug.apk \
            dist/termux-x11-proot-sphal-debug.apk
          cp build/termux-x11/lorie-app/build/outputs/apk/debug/termux-x11-nightly-*-all.deb dist/
          cp build/termux-x11/lorie-app/build/outputs/apk/debug/termux-x11-nightly-*-any.pkg.tar.xz dist/
          tar -C patches -cJf dist/termux-x11-proot-sphal-patches.tar.xz termux-x11
          (cd dist && sha256sum termux-x11-* > SHA256SUMS)
      - name: Upload paired server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termux-x11-proot-sphal-${{ github.sha }}
          path: dist/
          if-no-files-found: error
