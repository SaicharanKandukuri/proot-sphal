name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test loader API
        run: make check
      - name: Check scripts and verifier
        run: |
          bash -n scripts/build.sh scripts/proot-sphal-run
          python3 -m py_compile packaging/verify_libhybris.py
